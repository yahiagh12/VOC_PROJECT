# Nuclei Phase 2 scanner -- template-based DAST against URLs harvested
# by Phase 1 (Step 2) discovery.
#
# Phase 1 already produced a per-target ConfigMap (key `all_urls.txt`)
# that we mount at /targets. nuclei reads it via `-l`. We dropped the
# per-job gospider init container that the original CronJob (nuclei-job.yaml)
# uses, because discovery now happens centrally in Step 2 so the same
# URL inventory feeds nuclei + sqlmap + xss consistently.
#
# Placeholders substituted by scripts/scan-all.sh:
#   __JOB_NAME__     : unique per target+run
#   __TARGETS_CM__   : name of the per-target ConfigMap from Phase 1
apiVersion: batch/v1
kind: Job
metadata:
  name: __JOB_NAME__
  namespace: scanning
spec:
  # MUST exceed the worst-case harvest wait in scripts/scan-all.sh (1800s per
  # target, waited serially). At the old 300s, the juice-shop job finished,
  # Kubernetes garbage-collected it five minutes later while the harvest was
  # still blocked on dvwa, and the harvest then reported
  # "Job nuclei-juice-shop-... not found after 6 checks" — a completed scan
  # whose results were deleted before anyone read them.
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      volumes:
        - name: work
          emptyDir: {}
        - name: targets
          configMap:
            name: __TARGETS_CM__
      containers:
        - name: nuclei
          image: projectdiscovery/nuclei:v3.10.0
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              # Nuclei is a HOST scanner, not a URL scanner: its templates
              # append their own paths. Phase 1 hands us all_urls.txt, which for
              # Juice Shop is 53 entries that are all the SAME host — mostly
              # Angular SPA fragments (#/about, #/basket) the server never even
              # sees. Passing that list ran the entire template set once per
              # URL: 118296 requests for one web app, which is why the job blew
              # through a 1800s timeout and got reported as SKIP every run.
              #
              # Deduplicating to the host first is the whole fix. Measured on
              # juice-shop, same templates, same flags:
              #
              #   -l all_urls.txt (53 URLs) : 118296 requests, >31 min, timeout
              #   -l hosts.txt    (1 host)  :   2232 requests,   2 min, 19 hits
              #
              # The full URL inventory is still the right input for sqlmap and
              # xsstrike, which genuinely need parameterised URLs — this only
              # changes what nuclei is pointed at.
              #
              # `info` is included in -severity on purpose. On these targets 18
              # of the 19 matches are info-severity (exposed Swagger endpoint,
              # Prometheus metrics, missing security headers, robots.txt); the
              # old low,medium,high,critical filter is why every run reported
              # zero findings even when nuclei completed. The prioritization
              # service re-scores everything by asset context anyway, so an
              # info finding on an internet-facing asset still surfaces.
              #
              # -t http/ restricts to HTTP templates. The network templates were
              # probing odd ports (dvwa:43800) and burning a full -timeout on
              # each closed port.
              if [ -s /targets/all_urls.txt ]; then
                sed -E 's|(https?://[^/]+).*|\1|' /targets/all_urls.txt \
                  | sort -u > /work/hosts.txt
                echo "nuclei targets (deduplicated to hosts):"
                cat /work/hosts.txt
                nuclei -l /work/hosts.txt \
                      -t http/ \
                      -severity info,low,medium,high,critical \
                      -etags dos,fuzz,intrusive,brute-force \
                      -timeout 5 \
                      -bulk-size 25 \
                      -c 25 \
                      -rate-limit 75 \
                      -max-host-error 100 \
                      -ni \
                      -H "Cookie: __COOKIE__" \
                      -jsonl -o /work/nuclei.jsonl
              else
                : > /work/nuclei.jsonl
              fi
              echo "===NUCLEI_RESULTS_START==="
              cat /work/nuclei.jsonl 2>/dev/null || true
              echo "===NUCLEI_RESULTS_END==="
          volumeMounts:
            - name: work
              mountPath: /work
            - name: targets
              mountPath: /targets
              readOnly: true
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              # Template signature verification is CPU-bound and single-run
              # cost; 1 core made it a large fraction of the scan.
              cpu: "2"
              memory: "2048Mi"
