# Grype scanner — scans a container image for vulnerabilities (SCA).
# Placeholder substituted by scripts/scan-all.sh:
#   __JOB_NAME__     : unique per target+run
#   __TARGET_IMAGE__ : the docker image to scan
#
# Mounts the shared grype-db-cache PVC (see grype-db-pvc.yaml) so the
# vulnerability DB persists across runs instead of re-downloading on
# every scan. scan-all.sh runs grype-db-warm-job.yaml once, synchronously,
# before launching the parallel per-image jobs below, so by the time this
# job starts the cache is already populated.
apiVersion: batch/v1
kind: Job
metadata:
  name: __JOB_NAME__
  namespace: scanning
  labels:
    app: grype
    voc.project/scanner: "true"
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: grype
          image: anchore/grype:v0.115.0-debug
          imagePullPolicy: IfNotPresent
          env:
            - name: GRYPE_DB_CACHE_DIR
              value: /cache/grype/db
          command: ["sh", "-c"]
          args:
            - |
              set -e
              echo "Scanning image: __TARGET_IMAGE__"
              /grype "__TARGET_IMAGE__" -o json > /work/grype.json
              echo "===GRYPE_RESULTS_START==="
              cat /work/grype.json 2>/dev/null || true
              echo "===GRYPE_RESULTS_END==="
          volumeMounts:
            - name: work
              mountPath: /work
            - name: grype-db
              mountPath: /cache/grype/db
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "1"
              memory: "1024Mi"
      volumes:
        - name: work
          emptyDir: {}
        - name: grype-db
          persistentVolumeClaim:
            claimName: grype-db-cache