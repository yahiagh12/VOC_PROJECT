# ZAP scanner — headless DAST quick scan against Juice Shop.
# Manual run:  kubectl create job manual-zap --from=cronjob/zap -n scanning
# Image is ~1.5GB; first pull is slow.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: zap
  namespace: scanning
  labels:
    app: zap
    voc.project/scanner: "true"
spec:
  schedule: "30 2 * * *"           # daily 02:30 (after Grype)
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          initContainers:
            - name: zap
              image: softwaresecurityproject/zap-stable:2.15.0
              command: ["zap.sh"]
              args:
                - "-cmd"
                - "-quickurl"
                - "http://juice-shop.targets.svc.cluster.local:3000"
                - "-quickout"
                - "/work/zap.xml"
                - "-quickprogress"
              volumeMounts:
                - name: work
                  mountPath: /work
          containers:
            - name: upload
              image: curlimages/curl:8.10.1
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -e
                  if [ -z "${DD_URL}" ]; then echo "DD_URL not set; skipping upload"; head -c 500 /work/zap.xml; exit 0; fi
                  echo "Uploading ZAP XML to DefectDojo"
                  curl -sS -X POST "${DD_URL}/api/v2/import-scan/" \
                    -H "Authorization: Token ${DD_API_KEY}" \
                    -F "file=@/work/zap.xml" \
                    -F "scan_type=ZAP Scan" \
                    -F "product_name=${DD_PRODUCT_NAME}" \
                    -F "engagement_name=${DD_ENGAGEMENT_NAME}" \
                    -F "auto_create_contexts=true"
              env:
                - name: DD_URL
                  valueFrom:
                    secretKeyRef:
                      name: defectdojo-creds
                      key: url
                - name: DD_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: defectdojo-creds
                      key: api-key
                - name: DD_PRODUCT_NAME
                  value: "Lab Targets"
                - name: DD_ENGAGEMENT_NAME
                  value: "ZAP Daily"
              volumeMounts:
                - name: work
                  mountPath: /work
          volumes:
            - name: work
              emptyDir: {}
