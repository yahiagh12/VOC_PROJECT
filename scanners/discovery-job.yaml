# Discovery job — Phase 1 of the VOC pipeline.
#
# Runs katana once against __TARGET_URL__ and re-emits discovered URLs
# between ===DISCOVERY_RESULTS_START=== / ===_END=== markers so scan-all.sh
# can harvest them via `kubectl logs`, then:
#   - persist them locally for forensics
#   - split into all_urls.txt and param_urls.txt
#   - push them into a ConfigMap (scripts/scan-all.sh) that the Phase 2
#     scanners (sqlmap / xss / nuclei) mount at /targets, so every Phase 2
#     scanner sees the SAME URL inventory rather than each tool re-crawling
#     with its own init container.
#
# NOTE: uses projectdiscovery/katana (multi-arch, runs on arm64/Apple
# Silicon) — the previous gospider image (nenadzaric/gospider) is
# amd64-only and fails with ImagePullBackOff on arm64 k3d nodes.
#
# Placeholder substituted by scripts/scan-all.sh:
#   __JOB_NAME__     : unique job name per target+run
#   __TARGET_URL__   : http://<svc>.<ns>.svc.cluster.local:<port>
apiVersion: batch/v1
kind: Job
metadata:
  name: __JOB_NAME__
  namespace: scanning
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: Never
      volumes:
        - name: work
          emptyDir: {}
      containers:
        - name: katana
          image: projectdiscovery/katana:v1.6.1
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              # katana -silent prints one bare URL per line on stdout.
              # -d 3 = crawl depth 3, -fs rdn = stay on the target host,
              # -nc = no colour codes. Grep keeps only http(s) URLs so
              # downstream tools get a clean list regardless of format.
              katana -u "__TARGET_URL__" -d 3 -silent -nc -fs rdn \
                2>/dev/null \
                | grep -oE 'https?://[^[:space:]|]+' \
                | sort -u > /work/urls.txt || true
              echo "===DISCOVERY_RESULTS_START==="
              cat /work/urls.txt 2>/dev/null || true
              echo "===DISCOVERY_RESULTS_END==="
          volumeMounts:
            - name: work
              mountPath: /work
          resources:
            limits:
              memory: "128Mi"
              cpu: "100m"