# Nuclei scanner ??? template-based DAST against lab targets.
# Manual run:  kubectl create job manual-nuclei --from=cronjob/nuclei -n scanning
# First run is slow: Nuclei downloads/updates templates.
#
# IMPORTANT: DefectDojo's Nuclei parser expects a JSON ARRAY, but Nuclei
# outputs JSONL (one JSON object per line). A conversion init container
# using jq is included below (adapted from colleague's scan-all.sh fix).
# Nuclei scanner ??? template-based DAST against lab targets with integrated crawler.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: nuclei
  namespace: scanning
spec:
  schedule: "0 3 * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          initContainers:
            - name: crawler
              image: nenadzaric/gospider:a4244c8
              command: ["/bin/sh", "-c"]
              args:
                - |
                  gospider -s "$(TARGET_URL)" --sitemap --robots --depth 1 --js=false -q | sort -u > /work/urls_clean.txt
                  echo "Pipeline: $(wc -l < /work/urls_clean.txt) URLs extraites."
              env:
                - name: TARGET_URL
                  value: "http://juice-shop.targets.svc.cluster.local:3000"
              volumeMounts:
                - name: work
                  mountPath: /work
            - name: nuclei
              image: projectdiscovery/nuclei:v3.10.0
              command: ["/bin/sh", "-c"]
              args:
                - | 
                  echo "--- LANCEMENT DU SCAN ---" 
                  nuclei -update-templates 
                  nuclei -l /work/urls_clean.txt -severity info,low,medium,high,critical -jsonl -o /work/nuclei.jsonl -debug -vv
                  echo "--- SCAN TERMIN?? ---"
              env:
                - name: TARGET_URL
                  value: "http://juice-shop.targets.svc.cluster.local:3000"
              volumeMounts:
                - name: work
                  mountPath: /work
            - name: convert-jsonl
              image: alpine:3.20
              command: ["/bin/sh", "-c"]
              args:
                - |
                  apk add --no-cache jq
                  if [ -s /work/nuclei.jsonl ]; then
                    jq -s '.' /work/nuclei.jsonl > /work/nuclei.json
                  else
                    echo "[]" > /work/nuclei.json
                  fi
              volumeMounts:
                - name: work
                  mountPath: /work
          containers:
            - name: upload
              image: curlimages/curl:8.10.1
              command: ["/bin/sh", "-c"]
              args:
                - |
                  if [ -s /work/nuclei.json ] && [ "$(cat /work/nuclei.json)" != "[]" ]; then
                    curl -sS -X POST "${DD_URL}/api/v2/import-scan/" \
                      -H "Authorization: Token ${DD_API_KEY}" \
                      -F "file=@/work/nuclei.json" \
                      -F "scan_type=Nuclei Scan" \
                      -F "product_name=Lab Targets" \
                      -F "engagement_name=Nuclei Daily"
                  fi
              env:
                - name: DD_URL
                  valueFrom: { secretKeyRef: { name: defectdojo-creds, key: url } }
                - name: DD_API_KEY
                  valueFrom: { secretKeyRef: { name: defectdojo-creds, key: api-key } }
              volumeMounts:
                - name: work
                  mountPath: /work
          volumes:
            - name: work
              emptyDir: {}
