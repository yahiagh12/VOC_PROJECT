# Docker Compose for the VOC dev toolbox.
# Usage:
#   docker compose build
#   docker compose run --rm voc        # interactive shell
#   docker compose run --rm voc voc-up # one-shot command
#
# The toolbox has kubectl, helm, k3d, docker CLI, jq, yq, python, git.
# The repo is mounted at /workspace. The Docker socket is mounted so
# the toolbox can create k3d clusters (k3s-in-docker) and run scanner
# containers. The kubeconfig is written to .kube/ in the repo root so
# it's accessible from the Windows host too.
#
# On the host, after voc-up:
#   $env:KUBECONFIG = "<repo-root>\.kube\config"       # Windows
#   export KUBECONFIG="$(pwd)/.kube/config"             # macOS/Linux
#   kubectl get nodes

services:
  voc:
    build:
      context: ./toolbox
      dockerfile: Dockerfile
    image: voc-toolbox:latest
    container_name: voc
    ports:
      - "8080:8080" # DefectDojo
      - "5678:5678" # n8n
      - "3000:3000" # Juice Shop
    volumes:
      - .:/workspace
      - /var/run/docker.sock:/var/run/docker.sock
      - voc-k3d:/root/.k3d
      - voc-helm:/root/.cache/helm
    extra_hosts:
      - "host.docker.internal:host-gateway"
    working_dir: /workspace
    stdin_open: true
    tty: true

volumes:
  voc-k3d:
  voc-helm:
