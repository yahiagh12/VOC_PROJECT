# OWASP ZAP Automation Framework plan.
# Used by scan-all.sh (docker run ... -autorun /zap/config/zap-plan.yaml)
# and by the ZAP k8s CronJob.
#
# Tune spider/scan durations to fit your lab. 3 min spider + 5 min active
# scan is a quick pass; increase for deeper coverage.
env:
  contexts:
    - name: "juice-shop"
      urls:
        - "http://juice-shop:3000"
    - name: "dvwa"
      urls:
        - "http://dvwa:80"
  parameters:
    failOnError: false
jobs:
  - type: spider
    parameters:
      context: juice-shop
      maxDuration: 3
  - type: spider
    parameters:
      context: dvwa
      maxDuration: 3
  - type: passiveScan-wait
    parameters:
      maxDuration: 2
  - type: activeScan
    parameters:
      context: juice-shop
      maxScanDurationInMins: 5
      policy: Default Policy
  - type: report
    parameters:
      template: traditional-xml
      reportDir: /zap/wrk
      reportFile: zap-report-auto.xml
