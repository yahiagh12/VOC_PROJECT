apiVersion: v1
kind: ConfigMap
metadata:
  name: prioritization-config
  namespace: voc-core
data:
  DEFECTDOJO_URL: "http://defectdojo-django.voc-core.svc.cluster.local"
  DEFECTDOJO_VERIFY_TLS: "false"

  # --- threat intelligence ---
  EPSS_API_URL: "https://api.first.org/data/v1/epss"
  KEV_ENABLED: "true"
  KEV_PRIORITY_FLOOR: "70"

  # --- base score weights (bug severity vs exploitation likelihood) ---
  CVSS_WEIGHT: "0.5"
  EPSS_WEIGHT: "0.5"
  EPSS_HIGH_THRESHOLD: "0.7"

  # --- asset context (see asset-inventory.yaml) ---
  ASSET_INVENTORY_PATH: "/config/asset-inventory.yaml"
  EXPOSURE_WEIGHT: "0.4"
  CRITICALITY_WEIGHT: "0.4"
  DATA_WEIGHT: "0.2"
  # Widen this spread to make business context outrank raw severity harder;
  # set both to 1.0 to disable context entirely.
  CONTEXT_MIN_MULTIPLIER: "0.5"
  CONTEXT_MAX_MULTIPLIER: "1.6"
  WRITE_EXPLANATION: "false"

  RUN_SCHEDULER: "true"
  SCORING_INTERVAL_SECONDS: "3600"
  LOG_LEVEL: "INFO"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prioritization-service
  namespace: voc-core
  labels:
    app: prioritization-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prioritization-service
  template:
    metadata:
      labels:
        app: prioritization-service
    spec:
      containers:
        - name: prioritization-service
          image: prioritization-service:0.1.0
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: prioritization-config
            - secretRef:
                name: prioritization-secrets
          volumeMounts:
            # Asset inventory lives in a ConfigMap so business context can be
            # edited + `POST /reload`ed without rebuilding the image.
            - name: asset-inventory
              mountPath: /config
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: asset-inventory
          configMap:
            name: voc-asset-inventory
            optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: prioritization-service
  namespace: voc-core
spec:
  selector:
    app: prioritization-service
  ports:
    - name: http
      port: 8000
      targetPort: 8000
  type: ClusterIP
