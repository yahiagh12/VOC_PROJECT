# TheHive 5 Community Edition — Lab Deployment
#
# DEPRECATED: This Helm values file was originally planned for a Helm chart
# deployment, but TheHive doesn't have a widely available public Helm chart.
#
# CURRENT APPROACH: TheHive is deployed via raw K8s manifests in
# thehive-deployment.yaml (uses BerkeleyJE + Lucene, no Cassandra/OpenSearch).
#
# Deploy:
#   kubectl apply -f k8s/thehive/thehive-deployment.yaml
#
# Or via the toolbox:
#   voc-deploy thehive
#
# Access: http://localhost:9000
# Default login: admin@thehive.local / secret
#
# If you need the full production stack (Cassandra + OpenSearch), consider
# running TheHive via Docker Compose outside the cluster, or creating a
# custom Helm chart from the official docker-compose.yml.

# The settings below are kept for reference only (Helm chart doesn't exist):
thehive:
  image:
    tag: 5.4          # pin to a concrete 5.x release after confirming
  config:
    application:
      secret: "REPLACE_WITH_RANDOM_64_BYTE_STRING"
      ei:
        type: local      # local storage for lab; object storage for prod
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits:   { cpu: 1000m, memory: 1Gi }
  ingress:
    enabled: false

cassandra:
  enabled: false       # not needed for lab (BerkeleyJE backend used instead)

opensearch:
  enabled: false       # not needed for lab (Lucene backend used instead)
