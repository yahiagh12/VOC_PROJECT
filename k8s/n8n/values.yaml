# n8n self-hosted — community-charts/n8n Helm chart.
#
# Add the repo:
#   helm repo add community-charts https://community-charts.github.io/helm-charts
#   helm repo update
#   helm show values community-charts/n8n > docs/n8n-defaults.yaml
#
# Install:
#   helm install n8n community-charts/n8n -n voc-core -f k8s/n8n/values.yaml

image:
  tag: latest

# ServiceAccount must exist for RBAC binding in n8n-rbac.yaml to work.
# The SA is projected into the n8n pod so the master workflow can call
# the K8s API to create/poll scan orchestrator Jobs.
serviceAccount:
  create: true
  name: n8n

ingress:
  enabled: false

service:
  type: ClusterIP
  port: 5678

resources:
  requests: { cpu: 100m, memory: 256Mi }
  limits:   { cpu: 500m, memory: 1Gi }

# Use bundled PostgreSQL (lab-only, not HA).
db:
  type: postgresdb

postgresql:
  enabled: true
  auth:
    database: "n8n"
    username: "n8n"
    password: "n8n-lab-password"

# Environment variables available to all n8n workflows via $env.
# DD credentials let the master dashboard workflow query DefectDojo.
extraEnv:
  - name: N8N_BLOCK_ENV_ACCESS_IN_NODE
    value: "false"
  - name: DD_URL
    value: "http://defectdojo-django.voc-core.svc.cluster.local"
  - name: WEBHOOK_URL
    value: ""
  - name: K8S_TOKEN
    valueFrom:
      secretKeyRef:
        name: n8n-token
        key: token
  - name: DD_API_KEY
    valueFrom:
      secretKeyRef:
        name: defectdojo-creds
        key: api-key
        optional: true
  - name: THEHIVE_URL
    value: "http://thehive-svc.voc-core.svc.cluster.local:9000"
  - name: N8N_THEHIVE_API_KEY
    valueFrom:
      secretKeyRef:
        name: thehive-creds
        key: api-key
        optional: true



