# DefectDojo Helm chart values — low-resource profile for <=16GB RAM labs.
# Merged from colleague's resource-constrained config + scaffolding defaults.
#
# Add the repo:
#   helm repo add defectdojo https://raw.githubusercontent.com/DefectDojo/django-DefectDojo/helm-charts
#   helm repo update
# Install:
#   helm install defectdojo defectdojo/defectdojo -n voc-core -f k8s/defectdojo/values.yaml
#
# Total estimated RAM with these limits: ~3 GB (DD) + 2 GB (PG) + 1 GB (valkey) = ~6 GB
# Leave ~10 GB for k3s, n8n, TheHive, monitoring, and scanners.

tag: latest
siteUrl: http://localhost:8080
domain: localhost

createSecret: true
host: defectdojo.local

ingress:
  enabled: false

networkPolicy:
  enabled: false

# Bundled Postgres (not HA, lab only). Enable persistence to keep data
# across cluster restarts; disable for an ephemeral lab.
postgresql:
  enabled: true
  postgresqlPassword: CHANGE_ME_DOJO_PG
  persistence:
    enabled: false
    size: 10Gi
    storageClass: local-path
  resources:
    limits:
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi

# Valkey = modern Redis fork used by recent DefectDojo chart versions.
valkey:
  enabled: true
  password: CHANGE_ME_DOJO_VALKEY
  persistence:
    enabled: false
  resources:
    limits:
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 128Mi

celery:
  enabled: true
  password: CHANGE_ME_DOJO_CELERY
  broker:
    replicas: 1
  beat:
    replicas: 1
  worker:
    replicas: 1
  resources:
    limits:
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi

django:
  replicas: 1
  resources:
    limits:
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi
  uwsgi:
    processes: 2
    threads: 2

initializer:
  enabled: true
