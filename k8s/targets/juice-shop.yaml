apiVersion: apps/v1
kind: Deployment
metadata:
  name: juice-shop
  namespace: targets
  labels:
    app: juice-shop
    voc.project/target: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: juice-shop
  template:
    metadata:
      labels:
        app: juice-shop
        voc.project/target: "true"
    spec:
      containers:
        - name: juice-shop
          image: bkimminich/juice-shop:v16.0.0
          ports:
            - containerPort: 3000
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: juice-shop
  namespace: targets
  labels:
    app: juice-shop
spec:
  selector:
    app: juice-shop
  ports:
    - name: http
      port: 3000
      targetPort: 3000
  type: ClusterIP
