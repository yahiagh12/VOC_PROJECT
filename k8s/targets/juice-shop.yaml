apiVersion: apps/v1
kind: Deployment
metadata:
  name: juice-shop
  namespace: targets
  labels:
    app: juice-shop
    voc.project/target: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: juice-shop
  template:
    metadata:
      labels:
        app: juice-shop
        voc.project/target: "true"
    spec:
      containers:
        - name: juice-shop
          image: bkimminich/juice-shop:v16.0.0
          ports:
            - containerPort: 3000
              name: http
          # Juice Shop is single-process Node. At the previous 500m limit it
          # stopped answering under DAST load, nuclei counted 30 timeouts and
          # dropped the host from its target list — every scan returned zero
          # findings. A scan target that cannot absorb a scan is not a useful
          # target, so it gets a real core to work with.
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: juice-shop
  namespace: targets
  labels:
    app: juice-shop
spec:
  selector:
    app: juice-shop
  ports:
    - name: http
      port: 3000
      targetPort: 3000
  type: ClusterIP
