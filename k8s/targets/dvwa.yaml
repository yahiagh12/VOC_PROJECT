apiVersion: apps/v1
kind: Deployment
metadata:
  name: dvwa
  namespace: targets
  labels:
    app: dvwa
    voc.project/target: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dvwa
  template:
    metadata:
      labels:
        app: dvwa
        voc.project/target: "true"
    spec:
      containers:
        - name: dvwa
          # All-in-one image (Apache + PHP + MySQL via supervisord).
          # Lab only: NEVER expose outside the cluster.
          image: vulnerables/web-dvwa:latest
          lifecycle:
            postStart:
              exec:
                command: ["/bin/sh", "-c", "sleep 10 && php -r \"\\$_POST['create_db']='Create / Reset Database'; \\$_SERVER['HTTP_HOST']='localhost'; \\$_SERVER['SERVER_NAME']='localhost'; \\$_SERVER['DOCUMENT_ROOT']='/var/www/html'; include('/var/www/html/setup.php');\""]
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
          readinessProbe:
            httpGet:
              path: /login.php
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /login.php
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: dvwa
  namespace: targets
  labels:
    app: dvwa
spec:
  selector:
    app: dvwa
  ports:
    - name: http
      port: 80
      targetPort: 80
  type: ClusterIP
